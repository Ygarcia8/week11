name: tfsec

on:
  push:
    branches: [ master, staging, prod ]
  pull_request:
    branches: [ prod ]
  schedule:
    - cron: '16 8 * * 3'

jobs:
  tfsec:
    name: Run tfsec sarif report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for Terraform files
        id: check_tf
        run: |
          if ls *.tf >/dev/null 2>&1; then
            echo "Terraform files found."
            echo "run_tfsec=true" >> $GITHUB_ENV
          else
            echo "No Terraform files found. Skipping tfsec."
            echo "run_tfsec=false" >> $GITHUB_ENV
          fi

      - name: Run tfsec
        if: env.run_tfsec == 'true'
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec.sarif

      - name: Upload SARIF file
        if: env.run_tfsec == 'true'
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: tfsec.sarif
