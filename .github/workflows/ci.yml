name: tfsec

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Check for Terraform files
        id: check_tf
        run: |
          count=$(find . -type f -name "*.tf" | wc -l)
          echo "Found $count Terraform files"
          if [ "$count" -gt 0 ]; then
            echo "run_build=true" >> $GITHUB_ENV
          else
            echo "No Terraform files found. Skipping build steps."
            echo "run_build=false" >> $GITHUB_ENV
          fi

      - name: Install tfsec
        if: env.run_build == 'true'
        run: |
          curl -sLo tfsec.tar.gz https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64.tar.gz
          tar -xzf tfsec.tar.gz
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/
          tfsec --version

      - name: Install tflint
        if: env.run_build == 'true'
        run: |
          curl -L https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip -o tflint.zip
          unzip tflint.zip -d /usr/local/bin
          tflint --version

      - name: Run tfsec
        if: env.run_build == 'true'
        run: tfsec .

      - name: Run tflint
        run: tflint --chdir .


      - name: Final check
        run: echo "✅ CI steps completed!"

